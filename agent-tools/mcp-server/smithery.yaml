# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      gatewayUrl:
        type: string
        description: "URL of the Solana x402 compliance gateway"
        default: "https://msb-solana-enterprise-payment-gateway.duckdns.org"
      channelId:
        type: string
        description: "Payment channel identifier for x402 settlement"
        default: "chan_smoke_test_001"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@msantagiulianab/x402-mcp-server'],
      env: {
        X402_GATEWAY_URL: config.gatewayUrl || 'https://msb-solana-enterprise-payment-gateway.duckdns.org',
        X402_CHANNEL_ID: config.channelId || 'chan_smoke_test_001'
      }
    })